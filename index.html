<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace Minicart</title>
  </head>
  <body>
    <main id="app" x-data="minicart">
      <h1>Marketplace Minicart</h1>

      <template x-if="status === 'loading'">
        <p>Loading cart…</p>
      </template>

      <template x-if="status === 'empty'">
        <p>Your cart is empty.</p>
      </template>

      <template x-if="status === 'error'">
        <p x-text="errorMessage"></p>
      </template>

      <template x-if="status === 'ready' && cart">
        <div class="mt-6 space-y-6">
          <template x-for="shop in cart.shops" :key="shop.id">
            <section class="rounded-lg border border-slate-200 p-4">
              <div class="mb-4 flex items-center gap-3">
                <template x-if="shop.avatar">
                  <img
                    class="h-10 w-10 rounded-full object-cover"
                    :src="shop.avatar"
                    :alt="`${shop.name} avatar`"
                  />
                </template>
                <template x-if="!shop.avatar">
                  <div
                    class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-200 text-sm font-semibold text-slate-600"
                    aria-hidden="true"
                  >
                    <span x-text="shop.name?.charAt(0) || '?'">?</span>
                  </div>
                </template>

                <a
                  class="font-semibold text-slate-900 underline-offset-2 hover:underline"
                  :href="shop.link || '#'"
                  x-text="shop.name || 'Unknown shop'"
                ></a>
              </div>

              <ul class="divide-y divide-slate-200">
                <template x-for="cartItem in shop.cart_items" :key="cartItem.item.object_id">
                  <li class="flex gap-4 py-4 first:pt-0 last:pb-0">
                    <template x-if="cartItem.item.image">
                      <img
                        class="h-16 w-16 shrink-0 rounded-md object-cover"
                        :src="cartItem.item.image"
                        :alt="cartItem.item.name || 'Product image'"
                      />
                    </template>
                    <template x-if="!cartItem.item.image">
                      <div
                        class="flex h-16 w-16 shrink-0 items-center justify-center rounded-md bg-slate-100 text-xs text-slate-400"
                        aria-hidden="true"
                      >
                        No image
                      </div>
                    </template>

                    <div class="min-w-0 flex-1">
                      <p
                        class="font-medium text-slate-900"
                        x-text="cartItem.item.name || 'Unnamed product'"
                      ></p>
                      <p class="mt-1 text-sm text-slate-500">
                        Qty: <span x-text="cartItem.item.qty ?? '—'"></span>
                      </p>

                      <template x-if="isMadeToOrder(cartItem.item)">
                        <p
                          class="mt-2 text-sm text-amber-700"
                          x-text="preparationMessage(cartItem.item)"
                        ></p>
                      </template>

                      <template x-if="hasAccessories(cartItem.item)">
                        <div class="mt-3 rounded-md bg-slate-50 p-3">
                          <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">
                            Accessories
                          </p>
                          <ul class="mt-2 space-y-1 text-sm text-slate-600">
                            <template
                              x-for="accessory in getAccessories(cartItem.item)"
                              :key="accessory.id"
                            >
                              <li class="flex justify-between gap-3">
                                <span>
                                  <span x-text="accessory.name || 'Unnamed accessory'"></span>
                                  <span class="text-slate-400">
                                    ×<span x-text="accessory.qty ?? '—'"></span>
                                  </span>
                                </span>
                                <span
                                  class="shrink-0"
                                  x-text="formatMoney(accessory.price)"
                                ></span>
                              </li>
                            </template>
                          </ul>
                        </div>
                      </template>
                    </div>

                    <div class="shrink-0 text-right text-sm">
                      <p
                        class="text-slate-500"
                        x-text="`${formatMoney(cartItem.item.price)} / ${cartItem.item.unit || 'unit'}`"
                      ></p>
                      <p
                        class="mt-1 font-semibold text-slate-900"
                        x-text="formatMoney(itemTotal(cartItem.item))"
                      ></p>
                    </div>
                  </li>
                </template>
              </ul>

              <dl class="mt-5 space-y-2 border-t border-slate-200 pt-4 text-sm">
                <div class="flex justify-between gap-4">
                  <dt class="text-slate-500">Subtotal</dt>
                  <dd
                    class="font-medium text-slate-900"
                    x-text="formatMoney(shop.subtotal.subtotal)"
                  ></dd>
                </div>
                <div class="flex justify-between gap-4">
                  <dt class="text-slate-500">Shipping</dt>
                  <dd
                    class="font-medium text-slate-900"
                    x-text="formatMoney(shop.subtotal.shipping_price)"
                  ></dd>
                </div>
                <template x-if="hasAmount(shop.subtotal.discount)">
                  <div class="flex justify-between gap-4">
                    <dt class="text-slate-500">Discount</dt>
                    <dd
                      class="font-medium text-emerald-700"
                      x-text="`−${formatMoney(shop.subtotal.discount)}`"
                    ></dd>
                  </div>
                </template>
                <div class="flex justify-between gap-4 border-t border-slate-100 pt-2">
                  <dt class="font-semibold text-slate-900">Shop total</dt>
                  <dd
                    class="font-semibold text-slate-900"
                    x-text="formatMoney(shop.subtotal.total)"
                  ></dd>
                </div>
              </dl>
            </section>
          </template>

          <section class="rounded-lg border border-slate-200 p-4">
            <h2 class="text-lg font-semibold text-slate-900">Cart summary</h2>

            <dl class="mt-4 space-y-2 text-sm">
              <div class="flex justify-between gap-4">
                <dt class="text-slate-500">Products</dt>
                <dd
                  class="font-medium text-slate-900"
                  x-text="cart.grandtotal.product_qty"
                ></dd>
              </div>
              <div class="flex justify-between gap-4">
                <dt class="text-slate-500">Shops</dt>
                <dd
                  class="font-medium text-slate-900"
                  x-text="cart.grandtotal.shop_qty"
                ></dd>
              </div>
              <template x-if="hasAmount(cart.grandtotal.discount)">
                <div class="flex justify-between gap-4">
                  <dt class="text-slate-500">Discount</dt>
                  <dd
                    class="font-medium text-emerald-700"
                    x-text="`−${formatMoney(cart.grandtotal.discount)}`"
                  ></dd>
                </div>
              </template>
              <div class="flex justify-between gap-4 border-t border-slate-200 pt-3 text-base">
                <dt class="font-semibold text-slate-900">Grand total</dt>
                <dd
                  class="font-bold text-slate-900"
                  x-text="formatMoney(cart.grandtotal.grandtotal)"
                ></dd>
              </div>
            </dl>

            <template x-if="cart.discounts.giftcards.length > 0">
              <div class="mt-5 border-t border-slate-200 pt-4">
                <h3 class="font-semibold text-slate-900">Gift cards</h3>
                <ul class="mt-3 space-y-2 text-sm">
                  <template
                    x-for="giftcard in cart.discounts.giftcards"
                    :key="giftcard.id"
                  >
                    <li class="flex justify-between gap-4 rounded-md bg-slate-50 px-3 py-2">
                      <span>
                        <span class="font-mono text-slate-700" x-text="giftcard.code"></span>
                        <span class="ml-2 text-slate-500" x-text="giftcard.status"></span>
                      </span>
                      <span
                        class="shrink-0 font-medium text-slate-900"
                        x-text="formatMoney(giftcard.value)"
                      ></span>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </section>
        </div>
      </template>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
